

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morpheus Games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d14;
      color: #f5f5f7;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px 24px;
      text-align: center;
    }
    h1 {
      font-size: clamp(38px, 8vw, 68px);
      letter-spacing: -2px;
      margin: 0 0 16px;
    }
    p {
      color: #a1a1aa;
      font-size: 18px;
      line-height: 1.6;
    }
    .accent { color: #6ba8ff; }
    .games { margin-top: 48px; }
    a { color: #83b6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer {
      text-align: center;
      padding: 28px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Morpheus <span class="accent">Games</span></h1>
    <p>Thoughtfully designed puzzle games for iPhone.</p>

    <div class="games">
      <h2>TowerDoku</h2>
      <p>A new logic puzzle experience. Coming soon.</p>
    </div>
  </main>
  <footer>
    &copy; 2026 Morpheus Games
  </footer>
</body>
</html>
